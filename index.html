<!DOCTYPE html>
<html lang="es">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1" />
<title>Producción Zapatería</title>
<link rel="manifest" href="manifest.json" />
<link rel="icon" href="icon-192.png" />
<link rel="apple-touch-icon" href="icon-192.png" />
<meta name="theme-color" content="#3B2A20" />
<link rel="stylesheet" href="style.css" />
<script src="https://www.gstatic.com/firebasejs/10.12.2/firebase-app-compat.js"></script>
<script src="https://www.gstatic.com/firebasejs/10.12.2/firebase-firestore-compat.js"></script>
<script src="https://cdn.jsdelivr.net/npm/tesseract.js@5/dist/tesseract.min.js"></script>
<script src="https://cdn.jsdelivr.net/npm/html2canvas@1.4.1/dist/html2canvas.min.js"></script>
</head>
<body>

<div id="authScreen" class="role-screen">
  <div class="role-card">
    <span class="brand-eyebrow">TALLER DE CALZADO</span>
    <h1 class="role-title">Producción de zapatillas</h1>
    <div id="authContent"></div>
  </div>
</div>

<div id="roleScreen" class="role-screen hidden">
  <div class="role-card">
    <span class="brand-eyebrow">TALLER DE CALZADO</span>
    <h1 class="role-title">Producción de zapatillas</h1>
    <p class="role-sub">¿Quién eres?</p>
    <button class="btn-primary" id="btn-owner">Soy la encargada</button>
    <button class="btn-save" id="btn-worker">Soy forrador/a</button>
    <div id="workerPicker" class="hidden">
      <p class="role-sub" style="margin-top:16px;">Elige tu nombre:</p>
      <div id="workerList"></div>
    </div>
  </div>
</div>

<div id="app" class="hidden">
  <header class="topbar">
    <div class="brand">
      <h1 id="appTitle">Producción de zapatillas</h1>
      <p class="brand-sub" id="appSub">Insumos · tareas · asignaciones</p>
    </div>
    <div class="topbar-btns">
      <button id="btn-equipo-header" class="switch-role hidden">👥 Equipo</button>
      <button id="btn-switch" class="switch-role">cerrar sesión</button>
    </div>
  </header>

  <nav class="tabs hidden" id="tabs">
    <button class="tab-btn active" data-tab="insumos">📦 Insumos</button>
    <button class="tab-btn" data-tab="tareas">📋 Tareas</button>
    <button class="tab-btn" data-tab="equipo">👥 Equipo</button>
  </nav>

  <div id="alertBar" class="alert-bar hidden"></div>

  <main id="content" class="content"></main>
</div>

<script src="app.js"></script>
<script>
  if ("serviceWorker" in navigator) {
    window.addEventListener("load", () => {
      navigator.serviceWorker.register("sw.js").catch(console.error);
    });
  }
</script>
</body>
</html>
